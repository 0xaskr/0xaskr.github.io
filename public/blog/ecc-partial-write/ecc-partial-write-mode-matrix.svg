<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK SC">
  <title id="title">ECC completely off 与 ECC enabled 下的 partial-write 性能路径</title>
  <desc id="desc">以有效 granule G 为单位，比较完整覆盖、ECC completely off 时 physical WDM masked write、ECC enabled 时 read-modify-write，以及未对齐更新跨两个 granules 的流量。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#f8fafc"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="2"/>
    </pattern>
    <style>
      text { font-family: "Noto Sans CJK SC", "Noto Sans", sans-serif; fill: #0f172a; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .header { font-size: 15px; font-weight: 700; fill: #475569; }
      .label { font-size: 17px; font-weight: 700; }
      .small { font-size: 14px; fill: #334155; }
      .tiny { font-size: 12px; fill: #475569; }
      .row { stroke: #cbd5e1; stroke-width: 1.2; rx: 12; }
      .node { stroke: #64748b; stroke-width: 1.3; rx: 8; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="820" fill="#f8fafc"/>
  <text x="600" y="43" text-anchor="middle" class="title">Partial Update：ECC Off 与 On 的核心差异是是否读取旧数据</text>
  <text x="600" y="72" text-anchor="middle" class="subtitle">G 为 controller 的有效处理粒度；1024-bit AXI 教学模型可先取 G = 128 B，真实 G 以目标 IP 为准</text>

  <text x="55" y="115" class="header">请求形态</text>
  <text x="315" y="115" class="header">controller 数据路径</text>
  <text x="965" y="115" class="header">简化服务量</text>

  <rect x="40" y="132" width="1120" height="120" class="row" fill="#f0fdf4"/>
  <text x="60" y="165" class="label">1. 完整覆盖 G</text>
  <text x="60" y="193" class="small">ECC off / on 相同</text>
  <text x="60" y="220" class="tiny">没有旧 byte 需要保留</text>
  <rect x="315" y="160" width="170" height="62" class="node" fill="#bbf7d0"/>
  <text x="400" y="187" text-anchor="middle" class="small">新数据完整覆盖</text>
  <text x="400" y="210" text-anchor="middle" class="label">G</text>
  <path d="M485 191 H625" class="arrow"/>
  <rect x="625" y="160" width="220" height="62" class="node" fill="#dcfce7"/>
  <text x="735" y="187" text-anchor="middle" class="small">直接写入</text>
  <text x="735" y="210" text-anchor="middle" class="label">WRITE G</text>
  <text x="965" y="184" class="label">D ≈ G</text>
  <text x="965" y="214" class="small">A = 1×</text>

  <rect x="40" y="267" width="1120" height="135" class="row" fill="#eff6ff"/>
  <text x="60" y="302" class="label">2. ECC completely off</text>
  <text x="60" y="330" class="small">Partial U，physical WDM 可用</text>
  <text x="60" y="357" class="tiny">AXI WSTRB 下推为 mask</text>
  <rect x="315" y="300" width="170" height="65" class="node" fill="#ffffff"/>
  <rect x="315" y="300" width="52" height="65" rx="8" fill="#93c5fd"/>
  <rect x="367" y="300" width="118" height="65" fill="#e2e8f0"/>
  <text x="341" y="338" text-anchor="middle" class="label">U</text>
  <path d="M485 333 H625" class="arrow"/>
  <rect x="625" y="300" width="220" height="65" class="node" fill="#dbeafe"/>
  <text x="735" y="327" text-anchor="middle" class="small">Masked write</text>
  <text x="735" y="351" text-anchor="middle" class="label">WRITE G</text>
  <text x="965" y="326" class="label">D ≈ G</text>
  <text x="965" y="356" class="small">A ≈ G / U</text>

  <rect x="40" y="417" width="1120" height="145" class="row" fill="#fff7ed"/>
  <text x="60" y="452" class="label">3. ECC enabled</text>
  <text x="60" y="480" class="small">Partial U，需要完整 ECC granule</text>
  <text x="60" y="507" class="tiny">必须保留未覆盖的旧 bytes</text>
  <rect x="315" y="452" width="125" height="65" class="node" fill="#ffedd5"/>
  <text x="377" y="479" text-anchor="middle" class="small">READ</text>
  <text x="377" y="503" text-anchor="middle" class="label">G</text>
  <path d="M440 485 H485" class="arrow"/>
  <rect x="485" y="452" width="190" height="65" class="node" fill="#fed7aa"/>
  <text x="580" y="479" text-anchor="middle" class="small">MERGE U + old</text>
  <text x="580" y="503" text-anchor="middle" class="label">ECC DATA</text>
  <path d="M675 485 H720" class="arrow"/>
  <rect x="720" y="452" width="125" height="65" class="node" fill="#ffedd5"/>
  <text x="782" y="479" text-anchor="middle" class="small">WRITE</text>
  <text x="782" y="503" text-anchor="middle" class="label">G</text>
  <text x="965" y="478" class="label">D ≈ 2G</text>
  <text x="965" y="508" class="small">A ≈ 2G / U</text>

  <rect x="40" y="577" width="1120" height="135" class="row" fill="#fef2f2"/>
  <text x="60" y="612" class="label">4. 未对齐，跨两个 G</text>
  <text x="60" y="640" class="small">两个 granules 都只被部分覆盖</text>
  <text x="60" y="667" class="tiny">一个 logical update 变两个 partials</text>
  <rect x="315" y="610" width="230" height="65" class="node" fill="#dbeafe"/>
  <text x="430" y="637" text-anchor="middle" class="small">ECC off：2 × masked writes</text>
  <text x="430" y="661" text-anchor="middle" class="label">2G</text>
  <rect x="615" y="610" width="230" height="65" class="node" fill="#fee2e2"/>
  <text x="730" y="637" text-anchor="middle" class="small">ECC on：2 × RMW</text>
  <text x="730" y="661" text-anchor="middle" class="label">4G</text>
  <text x="965" y="634" class="label">Off ≈ 2G</text>
  <text x="965" y="664" class="small">On ≈ 4G</text>

  <rect x="40" y="744" width="1120" height="48" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="600" y="774" text-anchor="middle" class="label">本文的 disable 指 ECC completely off；ECC bypass 是另一种硬件模式，不放进主对比</text>
</svg>
