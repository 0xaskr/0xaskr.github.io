<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK SC">
  <title id="title">二维 DMA deslice：一个 tile，多条 stride store</title>
  <desc id="desc">软件把 BF16[8,130] tile 按行 DMA 到 HBM，比较 tight 260 B stride、512 B stride 只写有效区、512 B stride 写满 padding 三种情况。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Noto Sans", sans-serif; fill: #0f172a; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .label { font-size: 17px; font-weight: 700; }
      .small { font-size: 14px; fill: #334155; }
      .tiny { font-size: 12px; fill: #475569; }
      .card { stroke: #64748b; stroke-width: 1.4; rx: 12; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" class="title">二维 DMA deslice：一个 tile，多条 stride store</text>
  <text x="600" y="70" text-anchor="middle" class="subtitle">BF16[8,130] 按行写到 HBM；dst_stride 决定每行起点，write_cols 决定实际写多少</text>
  <rect x="45" y="100" width="250" height="120" class="card" fill="#e0e7ff"/>
  <text x="170" y="132" text-anchor="middle" class="label">VMEM tile</text>
  <text x="170" y="160" text-anchor="middle" class="small">BF16[8, 130]</text>
  <text x="170" y="184" text-anchor="middle" class="small">8 rows × 260 B = 2080 B</text>
  <line x1="85" y1="195" x2="255" y2="195" stroke="#93c5fd" stroke-width="1"/>
  <line x1="85" y1="205" x2="255" y2="205" stroke="#93c5fd" stroke-width="1"/>
  <text x="170" y="213" text-anchor="middle" class="tiny">deslice：按行拆成 8 次写</text>

  <path d="M295 160 H365" class="arrow"/>

  <rect x="375" y="100" width="310" height="120" class="card" fill="#fef9c3"/>
  <text x="530" y="132" text-anchor="middle" class="label">DMA descriptors</text>
  <text x="530" y="160" text-anchor="middle" class="small">每行一个 row store</text>
  <text x="530" y="184" text-anchor="middle" class="small">dst_stride 决定下一行起始地址</text>
  <text x="530" y="208" text-anchor="middle" class="tiny">write_cols 决定每个 row store 实际写多少</text>

  <path d="M530 220 V242" class="arrow"/>

  <rect x="40" y="252" width="345" height="420" class="card" fill="#fef2f2"/>
  <text x="212" y="285" text-anchor="middle" class="label">rows130_tight</text>
  <text x="212" y="308" text-anchor="middle" class="small">dst_stride = 260 B，write = 260 B</text>
  <line x1="70" y1="330" x2="350" y2="330" stroke="#94a3b8"/>
  <rect x="70" y="345" width="130" height="26" fill="#93c5fd"/>
  <rect x="72" y="381" width="130" height="26" fill="#93c5fd"/>
  <rect x="74" y="417" width="130" height="26" fill="#93c5fd"/>
  <line x1="134" y1="335" x2="134" y2="455" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="198" y1="335" x2="198" y2="455" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="212" y="472" text-anchor="middle" class="tiny">行起点按 4 B 漂移：0, 4, 8, …</text>
  <text x="212" y="492" text-anchor="middle" class="tiny">多数行同时出现 partial head / tail</text>
  <text x="212" y="520" text-anchor="middle" class="tiny">每行 260 B = 2 full cycles + 4 B tail</text>

  <rect x="425" y="252" width="345" height="420" class="card" fill="#fffbeb"/>
  <text x="597" y="285" text-anchor="middle" class="label">rows130_padded_valid</text>
  <text x="597" y="308" text-anchor="middle" class="small">dst_stride = 512 B，write = 260 B</text>
  <line x1="455" y1="330" x2="735" y2="330" stroke="#94a3b8"/>
  <rect x="455" y="345" width="130" height="26" fill="#93c5fd"/>
  <rect x="455" y="381" width="130" height="26" fill="#93c5fd"/>
  <rect x="455" y="417" width="130" height="26" fill="#93c5fd"/>
  <line x1="519" y1="335" x2="519" y2="455" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="583" y1="335" x2="583" y2="455" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="597" y="472" text-anchor="middle" class="tiny">每行起点重新对齐 128 B</text>
  <text x="597" y="492" text-anchor="middle" class="tiny">但每行仍只写 260 B，4 B tail 保留</text>
  <text x="597" y="520" text-anchor="middle" class="tiny">只分配 padding 不写 padding，RMW 不会消失</text>

  <rect x="810" y="252" width="345" height="420" class="card" fill="#f0fdf4"/>
  <text x="982" y="285" text-anchor="middle" class="label">rows130_padded_full</text>
  <text x="982" y="308" text-anchor="middle" class="small">dst_stride = 512 B，write = 512 B</text>
  <line x1="840" y1="330" x2="1120" y2="330" stroke="#94a3b8"/>
  <rect x="840" y="345" width="256" height="26" fill="#86efac"/>
  <rect x="840" y="381" width="256" height="26" fill="#86efac"/>
  <rect x="840" y="417" width="256" height="26" fill="#86efac"/>
  <line x1="904" y1="335" x2="904" y2="455" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="968" y1="335" x2="968" y2="455" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="1032" y1="335" x2="1032" y2="455" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="982" y="472" text-anchor="middle" class="tiny">每行写满 512 B：4 个 full 128 B cycles</text>
  <text x="982" y="492" text-anchor="middle" class="tiny">多写 252 B padding，但 P = 0</text>
  <text x="982" y="520" text-anchor="middle" class="tiny">需要确认 padding 区域属于当前 buffer</text>

  <rect x="220" y="560" width="760" height="52" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="600" y="584" text-anchor="middle" class="label">同一个 BF16[8,130] deslice：descriptor 的 dst_stride 与 write_cols 决定 RMW 是否逐行重复</text>
  <text x="600" y="604" text-anchor="middle" class="tiny">P 要按 8 行累计，而不是只看一行</text>

</svg>
