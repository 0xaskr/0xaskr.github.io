<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc" font-family="Noto Sans">
  <title id="title">How software shapes a write: the decision order</title>
  <desc id="desc">Prefer a contiguous full write. When full coverage is impossible, try merging or padding safely. Failing that, write the bulk fully and leave only the unavoidable head/tail to the partial-write path, then check the boundary data.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: "Noto Sans", "Segoe UI", sans-serif; fill: #0f172a; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .label { font-size: 17px; font-weight: 700; }
      .small { font-size: 14px; fill: #334155; }
      .tiny { font-size: 12px; fill: #475569; }
      .card { stroke: #64748b; stroke-width: 1.4; rx: 12; }
      .node { stroke: #64748b; stroke-width: 1.3; rx: 9; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .diamond { stroke: #854d0e; stroke-width: 1.6; fill: #fef9c3; }
      .branch-yes { font-size: 14px; font-weight: 700; fill: #15803d; }
      .branch-no { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    </style>
  </defs>
  <rect width="1200" height="730" fill="#f8fafc"/>
  <text x="600" y="43" text-anchor="middle" class="title">How Software Shapes a Write: the Decision Order</text>
  <text x="600" y="71" text-anchor="middle" class="subtitle">Try a full aligned write first; if not, merge or pad safely; if still not, leave only the head/tail to the slow path.</text>
  <rect x="420" y="95" width="360" height="62" class="node" fill="#e0e7ff"/>
  <text x="600" y="121" text-anchor="middle" class="label">Preparing to write a range</text>
  <text x="600" y="143" text-anchor="middle" class="small">check address, length, stride — not the API name</text>

  <path d="M600 157 V182" class="arrow"/>

  <polygon points="600,182 850,240 600,298 350,240" class="diamond"/>
  <text x="600" y="234" text-anchor="middle" class="label">Can it cover G fully and aligned?</text>
  <text x="344" y="234" text-anchor="end" class="branch-yes">Yes</text>
  <text x="856" y="234" text-anchor="start" class="branch-no">No</text>

  <path d="M850 240 C 930 240, 1005 285, 1005 318" class="arrow"/>
  <rect x="880" y="330" width="250" height="72" class="node" fill="#dcfce7"/>
  <text x="1005" y="359" text-anchor="middle" class="label">Contiguous full write</text>
  <text x="1005" y="382" text-anchor="middle" class="small">no RMW triggered</text>

  <path d="M600 298 V330" class="arrow"/>
  <polygon points="600,330 850,388 600,446 350,388" class="diamond"/>
  <text x="600" y="382" text-anchor="middle" class="label">Can it merge or pad safely?</text>
  <text x="600" y="404" text-anchor="middle" class="small">extra bytes covered must belong to this buffer</text>
  <text x="344" y="382" text-anchor="end" class="branch-yes">Yes</text>
  <text x="856" y="382" text-anchor="start" class="branch-no">No</text>

  <path d="M350 388 C 220 388, 195 420, 195 462" class="arrow"/>
  <rect x="60" y="472" width="270" height="82" class="node" fill="#bbf7d0"/>
  <text x="195" y="500" text-anchor="middle" class="label">Form a complete data block</text>
  <text x="195" y="524" text-anchor="middle" class="small">then write it out in bulk</text>

  <path d="M850 388 C 930 388, 1005 420, 1005 458" class="arrow"/>
  <rect x="880" y="468" width="250" height="82" class="node" fill="#fef08a"/>
  <text x="1005" y="496" text-anchor="middle" class="label">Full write for the bulk</text>
  <text x="1005" y="520" text-anchor="middle" class="small">head/tail handled separately</text>

  <path d="M195 554 C 195 594, 560 594, 565 622" class="arrow"/>
  <path d="M1005 550 C 1005 600, 840 596, 840 622" class="arrow"/>
  <rect x="540" y="632" width="400" height="66" class="card" fill="#dbeafe"/>
  <text x="740" y="660" text-anchor="middle" class="label">Check the write range and neighbors</text>
  <text x="740" y="683" text-anchor="middle" class="small">nothing outside the range was covered or changed</text>
</svg>
