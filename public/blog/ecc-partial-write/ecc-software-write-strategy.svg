<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK SC">
  <title id="title">软件侧整理写入形态的决策顺序</title>
  <desc id="desc">优先连续完整写；不能完整覆盖时尝试安全合并或填充；仍不行则主体走完整写，仅让不可避免的头尾走局部写，最后检查边界数据。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Noto Sans", sans-serif; fill: #0f172a; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .label { font-size: 17px; font-weight: 700; }
      .small { font-size: 14px; fill: #334155; }
      .tiny { font-size: 12px; fill: #475569; }
      .card { stroke: #64748b; stroke-width: 1.4; rx: 12; }
      .node { stroke: #64748b; stroke-width: 1.3; rx: 9; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .diamond { stroke: #854d0e; stroke-width: 1.6; fill: #fef9c3; }
      .branch-yes { font-size: 14px; font-weight: 700; fill: #15803d; }
      .branch-no { font-size: 14px; font-weight: 700; fill: #b91c1c; }
    </style>
  </defs>
  <rect width="1200" height="730" fill="#f8fafc"/>
  <text x="600" y="43" text-anchor="middle" class="title">软件侧整理写入形态的决策顺序</text>
  <text x="600" y="71" text-anchor="middle" class="subtitle">先争取完整对齐写；做不到再考虑合并或填充；仍不行就只把头尾留给慢路径。</text>
  <rect x="420" y="95" width="360" height="62" class="node" fill="#e0e7ff"/>
  <text x="600" y="121" text-anchor="middle" class="label">准备写入一段数据</text>
  <text x="600" y="143" text-anchor="middle" class="small">先看地址、长度与 stride，不看 API 名字</text>

  <path d="M600 157 V182" class="arrow"/>

  <polygon points="600,182 850,240 600,298 350,240" class="diamond"/>
  <text x="600" y="234" text-anchor="middle" class="label">能完整且对齐地覆盖 G 吗？</text>
  <text x="344" y="234" text-anchor="end" class="branch-yes">能</text>
  <text x="856" y="234" text-anchor="start" class="branch-no">不能</text>

  <path d="M850 240 C 930 240, 1005 285, 1005 318" class="arrow"/>
  <rect x="880" y="330" width="250" height="72" class="node" fill="#dcfce7"/>
  <text x="1005" y="359" text-anchor="middle" class="label">连续完整写</text>
  <text x="1005" y="382" text-anchor="middle" class="small">不触发 RMW</text>

  <path d="M600 298 V330" class="arrow"/>
  <polygon points="600,330 850,388 600,446 350,388" class="diamond"/>
  <text x="600" y="382" text-anchor="middle" class="label">能安全合并或填充吗？</text>
  <text x="600" y="404" text-anchor="middle" class="small">额外覆盖的字节必须属于当前缓冲区</text>
  <text x="344" y="382" text-anchor="end" class="branch-yes">能</text>
  <text x="856" y="382" text-anchor="start" class="branch-no">不能</text>

  <path d="M350 388 C 220 388, 195 420, 195 462" class="arrow"/>
  <rect x="60" y="472" width="270" height="82" class="node" fill="#bbf7d0"/>
  <text x="195" y="500" text-anchor="middle" class="label">组成完整数据块</text>
  <text x="195" y="524" text-anchor="middle" class="small">再批量写出</text>

  <path d="M850 388 C 930 388, 1005 420, 1005 458" class="arrow"/>
  <rect x="880" y="468" width="250" height="82" class="node" fill="#fef08a"/>
  <text x="1005" y="496" text-anchor="middle" class="label">主体完整写</text>
  <text x="1005" y="520" text-anchor="middle" class="small">头尾单独处理</text>

  <path d="M195 554 C 195 594, 560 594, 565 622" class="arrow"/>
  <path d="M1005 550 C 1005 600, 840 596, 840 622" class="arrow"/>
  <rect x="540" y="632" width="400" height="66" class="card" fill="#dbeafe"/>
  <text x="740" y="660" text-anchor="middle" class="label">检查写入范围与邻接数据</text>
  <text x="740" y="683" text-anchor="middle" class="small">确认没有覆盖越界，也没有改变不应改变的字节</text>
</svg>
